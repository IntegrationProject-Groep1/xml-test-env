# contract_flows.yaml  —  Central message flow registry
# Groep 1 / Desideriushogeschool 2026  /  XML/XSD Contract v2.3
#
# One entry per message type per producer. This file is the single source of
# truth for integration tests. When a team adds a new sender, add an entry here.
#
# Fields:
#   id            Unique identifier (snake_case)
#   label         Human-readable description
#   source        Sender name as it appears in <header/source>
#   type          Message type as it appears in <header/type>
#   section       Contract document section reference
#   critical      true = failure blocks the build
#   producer.team Producing team
#   consumers[]   List of consuming teams + their queue name
#   routing       Exchange/routing key configuration
#     exchange    Empty string = default exchange (direct to queue)
#     exchange_type  topic | direct | fanout
#     routing_key Routing key; if exchange="", this is the queue name
#   example       Relative path to an example XML file (used for routing test)
#   schema        Relative path to XSD schema (used for validation)
#   ack_reply_queue  Optional: queue where consuming service posts ACK (reply-to pattern)
#
# Routing test mode:
#   When exchange is non-empty: shadow queue technique (exclusive temp queue bound to exchange)
#   When exchange is empty:     direct queue check (basic_get from named queue)

