services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  crm-mock:
    build:
      context: .
      dockerfile: Dockerfile.receiver
    environment:
      - QUEUE_NAME=crm.incoming
      - SERVICE_NAME=CRM
      - PYTHONUNBUFFERED=1
    tty: true
    volumes:
      - ./schemas:/app/schemas
    depends_on:
      rabbitmq:
        condition: service_healthy

  kassa-mock:
