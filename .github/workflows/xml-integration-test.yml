name: XML Integration & Contract Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout xml-test-env
      uses: actions/checkout@v3
      with:
        path: xml-test-env

    - name: Checkout xml-xsd-contract
      uses: actions/checkout@v3
      with:
        repository: IntegrationProject-Groep1/xml-xsd-contract
        path: xml-xsd-contract

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install lxml pika

    - name: Build and Start Services
      run: |
        cd $GITHUB_WORKSPACE/xml-test-env
        docker compose up --build -d
      env:
        RABBITMQ_HOST: rabbitmq

    - name: Wait for RabbitMQ Health
      run: |
        echo "Waiting for RabbitMQ to be healthy..."
        MAX_RETRIES=20
        COUNT=0
        until [ "$(docker inspect --format='{{.State.Health.Status}}' xml-test-env-rabbitmq-1)" == "healthy" ]; do
            if [ $COUNT -ge $MAX_RETRIES ]; then
                echo "Timeout waiting for RabbitMQ"
                docker compose -f $GITHUB_WORKSPACE/xml-test-env/docker-compose.yml logs
                exit 1
            fi
            echo "Waiting... ($COUNT)"
            sleep 5
            COUNT=$((COUNT+1))
        done
        echo "RabbitMQ is healthy!"

    - name: Extract XSDs and Examples
      run: |
        # Gebruik paden relatief aan de runner root
        export CONTRACT_PATH="$GITHUB_WORKSPACE/xml-xsd-contract/XML_XSD_Contract_v2.3_Centralized 1.md"
        python $GITHUB_WORKSPACE/xml-test-env/extract_xsds.py

    - name: Setup RabbitMQ Infrastructure
      run: |
        cd $GITHUB_WORKSPACE/xml-test-env
        python setup_queues.py
      env:
        RABBITMQ_HOST: localhost

    - name: Run XML Contract Integration Tests
      run: |
        cd $GITHUB_WORKSPACE/xml-test-env
        python run_contract_tests.py --live | tee test-output.txt
      env:
        RABBITMQ_HOST: localhost

    - name: Wait for Message Delivery
      run: |
        echo "Waiting 10 seconds for mock services to process messages..."
        sleep 10

    - name: Generate and Post Summary
      if: always()
      run: |
        cd $GITHUB_WORKSPACE/xml-test-env
        python generate_summary.py

    - name: Dump Mock Service Logs (Always)
      if: always()
      run: |
        cd $GITHUB_WORKSPACE/xml-test-env
        echo "=== ALL SERVICE LOGS ==="
        docker compose logs
