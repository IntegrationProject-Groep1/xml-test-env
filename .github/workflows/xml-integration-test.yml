name: Integration Test Suite

# ─────────────────────────────────────────────────────────────────────────────
# Two independent jobs:
#
#  builder-compliance  —  Checks out all team repos (public, no token needed)
#                         and runs test_contract_full.py Phase 1 & 3.
#                         Runs on every push/PR — no VM access required.
#
#  vm-routing          —  Runs test_integration.py against the live RabbitMQ
#                         on the Azure VM. Runs on main branch or manually.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   RABBIT_HOST       Azure VM public IP        (e.g. 20.126.113.148)
#   RABBIT_PORT       AMQP NodePort             (e.g. 30000)
#   RABBIT_MGMT_PORT  Management API NodePort   (e.g. 30001)
#   RABBIT_USER       RabbitMQ username
#   RABBIT_PASS       RabbitMQ password
#
# Team repos must be public. No ORG_READ_TOKEN needed.
# Update repository names below if repos are ever renamed.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      skip_builder:
        description: "Skip builder compliance job"
        type: boolean
        default: false
      skip_routing:
        description: "Skip VM routing job"
        type: boolean
        default: false

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: Builder compliance
  # ═══════════════════════════════════════════════════════════════════════════
  builder-compliance:
    name: Behavioral Audit (Phase 1 & 3)
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_builder }}

    steps:
      - name: Checkout xml-test-env
        uses: actions/checkout@v4
        with:
          path: xml-test-env

      # Public repos — no token required.
      # Update `repository` values if repos are renamed.
      - name: Checkout Kassa
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/Kassa
          path: Kassa
        continue-on-error: true

      - name: Checkout Planning
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/Planning
          path: Planning
        continue-on-error: true

      - name: Checkout Facturatie
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/Facturatie
          path: Facturatie
        continue-on-error: true

      - name: Checkout CRM
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/CRM
          path: CRM
        continue-on-error: true

      - name: Checkout Heartbeat
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/heartbeat
          path: heartbeat
        continue-on-error: true

      - name: Checkout Identity
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/identity-service
          path: identity-service
        continue-on-error: true

      - name: Checkout Mailing
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/Mailing
          path: Mailing
        continue-on-error: true

      - name: Checkout Monitoring
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/monitoring
          path: monitoring
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js for CRM
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install shared dependencies
        run: pip install --upgrade pip && pip install lxml pika python-dotenv defusedxml mysql-connector-python

      - name: Install CRM Node.js dependencies
        if: ${{ hashFiles('CRM/package.json') != '' }}
        run: cd CRM && npm install
        continue-on-error: true

      - name: Install Kassa dependencies
        if: ${{ hashFiles('Kassa/requirements.txt') != '' }}
        run: pip install -r Kassa/requirements.txt
        continue-on-error: true

      - name: Install Planning dependencies
        if: ${{ hashFiles('Planning/requirements.txt') != '' }}
        run: pip install -r Planning/requirements.txt
        continue-on-error: true

      - name: Install Facturatie dependencies
        if: ${{ hashFiles('Facturatie/requirements.txt') != '' }}
        run: pip install -r Facturatie/requirements.txt
        continue-on-error: true

      - name: Run comprehensive behavioral audit
        run: |
          python xml-test-env/test_contract_full.py \
            --repos-dir "$GITHUB_WORKSPACE"

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: VM routing verification
  # ═══════════════════════════════════════════════════════════════════════════
  vm-routing:
    name: VM Routing Verification (Phase 2)
    runs-on: ubuntu-latest
    if: |
      !inputs.skip_routing &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout xml-test-env
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pip && pip install lxml pika

      - name: Run VM routing test
        run: |
          python test_integration.py \
            --host      "$RABBIT_HOST" \
            --port      "$RABBIT_PORT" \
            --user      "$RABBIT_USER" \
            --pass      "$RABBIT_PASS" \
            --mgmt-port "$RABBIT_MGMT_PORT" \
            --timeout   10
        env:
          RABBIT_HOST:      ${{ secrets.RABBIT_HOST }}
          RABBIT_PORT:      ${{ secrets.RABBIT_PORT }}
          RABBIT_MGMT_PORT: ${{ secrets.RABBIT_MGMT_PORT }}
          RABBIT_USER:      ${{ secrets.RABBIT_USER }}
          RABBIT_PASS:      ${{ secrets.RABBIT_PASS }}
