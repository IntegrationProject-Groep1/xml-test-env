name: XML Integration & Contract Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout xml-test-env
      uses: actions/checkout@v3
      with:
        path: xml-test-env

    - name: Checkout xml-xsd-contract
      uses: actions/checkout@v3
      with:
        repository: IntegrationProject-Groep1/xml-xsd-contract
        path: xml-xsd-contract

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install lxml pika

    - name: Build and Start Services
      run: |
        cd xml-test-env
        # We laten docker-compose alles afhandelen (inclusief rabbitmq)
        docker compose up --build -d
      env:
        RABBITMQ_HOST: rabbitmq

    - name: Wait for RabbitMQ Health
      run: |
        echo "Waiting for RabbitMQ to be healthy..."
        # Wacht tot de rabbitmq container 'healthy' rapporteert
        MAX_RETRIES=20
        COUNT=0
        until [ "$(docker inspect --format='{{.State.Health.Status}}' xml-test-env-rabbitmq-1)" == "healthy" ]; do
            if [ $COUNT -ge $MAX_RETRIES ]; then
                echo "Timeout waiting for RabbitMQ"
                exit 1
            fi
            echo "Waiting... ($COUNT)"
            sleep 5
            COUNT=$((COUNT+1))
        done
        echo "RabbitMQ is healthy!"

    - name: Extract XSDs and Examples
      run: |
        export CONTRACT_PATH="../xml-xsd-contract/XML_XSD_Contract_v2.3_Centralized 1.md"
        python xml-test-env/extract_xsds.py

    - name: Setup RabbitMQ Infrastructure
      run: python xml-test-env/setup_queues.py
      env:
        RABBITMQ_HOST: localhost

    - name: Run XML Contract Integration Tests
      run: python xml-test-env/run_contract_tests.py --live
      env:
        RABBITMQ_HOST: localhost

    - name: Dump Mock Service Logs (Always)
      if: always()
      run: |
        cd xml-test-env
        echo "=== ALL SERVICE LOGS ==="
        docker compose logs
