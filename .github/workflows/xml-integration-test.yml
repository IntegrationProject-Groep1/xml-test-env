name: Integration Test Suite

# ─────────────────────────────────────────────────────────────────────────────
# This CI workflow runs a Comprehensive Behavioral Audit (Phase 1 & 3)
# across EVERY FLOW defined in the system.
#
# It executes the actual production code (PHP/Node.js/Python) from all teams.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: Comprehensive Behavioral Audit
  # ═══════════════════════════════════════════════════════════════════════════
  behavioral-audit:
    name: Full Behavioral Audit (All Teams)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout xml-test-env
        uses: actions/checkout@v4
        with:
          path: xml-test-env

      # All 9 repositories required for a full audit
      - name: Checkout Kassa
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/Kassa
          path: Kassa
        continue-on-error: true

      - name: Checkout Planning
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/Planning
          path: Planning
        continue-on-error: true

      - name: Checkout Facturatie
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/Facturatie
          path: Facturatie
        continue-on-error: true

      - name: Checkout CRM
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/CRM
          path: CRM
        continue-on-error: true

      - name: Checkout Heartbeat
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/heartbeat
          path: heartbeat
        continue-on-error: true

      - name: Checkout Identity
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/identity-service
          path: identity-service
        continue-on-error: true

      - name: Checkout Mailing
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/Mailing
          path: Mailing
        continue-on-error: true

      - name: Checkout Monitoring
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/monitoring
          path: monitoring
        continue-on-error: true

      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/IP-groep1-frontend
          path: IP-groep1-frontend
        continue-on-error: true

      - name: Checkout Contracts
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/contracts
          path: contracts
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js for CRM
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Set up PHP for Frontend
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: dom, libxml, simplexml

      - name: Install shared dependencies
        run: pip install --upgrade pip && pip install lxml pika python-dotenv defusedxml mysql-connector-python

      - name: Install CRM Node.js dependencies
        if: ${{ hashFiles('CRM/package.json') != '' }}
        run: cd CRM && npm install
        continue-on-error: true

      - name: Install Frontend PHP dependencies
        if: ${{ hashFiles('IP-groep1-frontend/composer.json') != '' }}
        run: cd IP-groep1-frontend && composer install --no-interaction --no-progress
        continue-on-error: true

      - name: Install Python Team dependencies
        run: |
          for dir in Kassa Planning Facturatie identity-service Mailing monitoring heartbeat; do
            if [ -f "$dir/requirements.txt" ]; then
              echo "Installing requirements for $dir..."
              pip install -r "$dir/requirements.txt" || true
            fi
          done

      - name: Run ALL-FLOWS Behavioral Audit
        run: |
          python xml-test-env/test_contract_full.py \
            --repos-dir "$GITHUB_WORKSPACE" \
            --verbose

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: VM routing verification (Phase 2)
  # ═══════════════════════════════════════════════════════════════════════════
  vm-routing:
    name: VM Routing (Phase 2)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout xml-test-env
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pip && pip install lxml pika

      - name: Run VM routing test
        run: |
          python test_integration.py \
            --host      "$RABBIT_HOST" \
            --port      "$RABBIT_PORT" \
            --user      "$RABBIT_USER" \
            --pass      "$RABBIT_PASS" \
            --mgmt-port "$RABBIT_MGMT_PORT" \
            --timeout   15
        env:
          RABBIT_HOST:      ${{ secrets.RABBIT_HOST }}
          RABBIT_PORT:      ${{ secrets.RABBIT_PORT }}
          RABBIT_MGMT_PORT: ${{ secrets.RABBIT_MGMT_PORT }}
          RABBIT_USER:      ${{ secrets.RABBIT_USER }}
          RABBIT_PASS:      ${{ secrets.RABBIT_PASS }}
