name: XML Integration & Contract Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - name: Checkout xml-test-env
      uses: actions/checkout@v3
      with:
        path: xml-test-env

    - name: Checkout xml-xsd-contract
      uses: actions/checkout@v3
      with:
        repository: IntegrationProject-Groep1/xml-xsd-contract
        path: xml-xsd-contract

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install lxml pika

    - name: Build and Start Mock Services
      run: |
        cd xml-test-env
        # Start alleen de mocks, NIET de compose rabbitmq (om poort-conflicten te vermijden)
        docker compose up --build -d crm-mock kassa-mock facturatie-mock planning-mock identity-mock mailing-mock frontend-mock monitoring-mock
      env:
        # Dit vertelt de containers in compose om naar de GitHub Service rabbitmq te kijken
        RABBITMQ_HOST: rabbitmq 

    - name: Wait for Mocks to be ready
      run: sleep 15

    - name: Extract XSDs and Examples
      run: |
        export CONTRACT_PATH="../xml-xsd-contract/XML_XSD_Contract_v2.3_Centralized 1.md"
        python xml-test-env/extract_xsds.py

    - name: Setup RabbitMQ Infrastructure
      run: python xml-test-env/setup_queues.py
      env:
        RABBITMQ_HOST: localhost

    - name: Run XML Contract Integration Tests
      run: python xml-test-env/run_contract_tests.py --live
      env:
        RABBITMQ_HOST: localhost

    - name: Dump Mock Service Logs (Always)
      if: always()
      run: |
        cd xml-test-env
        echo "=== CRM MOCK LOGS ==="
        docker compose logs crm-mock
        echo "=== KASSA MOCK LOGS ==="
        docker compose logs kassa-mock
        echo "=== FACTURATIE MOCK LOGS ==="
        docker compose logs facturatie-mock
        echo "=== PLANNING MOCK LOGS ==="
        docker compose logs planning-mock
        echo "=== IDENTITY MOCK LOGS ==="
        docker compose logs identity-mock
        echo "=== MAILING MOCK LOGS ==="
        docker compose logs mailing-mock
